services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blok
      POSTGRES_PASSWORD: blok
      POSTGRES_DB: blok
    ports:
      - "5434:5432"
    volumes:
      - blok_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blok -d blok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://blok:blok@db:5432/blok
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  blok_pg_data:
